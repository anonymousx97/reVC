name: Build reVC Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/launcher/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android/launcher
          ./gradlew assembleDebug --stacktrace --parallel --max-workers=$(nproc)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-arm64-debug-apk
          path: android/launcher/app/build/outputs/apk/debug/*.apk
          retention-days: 14