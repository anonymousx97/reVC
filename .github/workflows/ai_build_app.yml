name: Build reVC Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java 17 with Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Android NDK
        uses: actions/cache@v4
        id: ndk-cache
        with:
          path: /usr/local/lib/android/sdk/ndk/27.2.12479018
          key: ${{ runner.os }}-ndk-27.2.12479018

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Cache C++ Build Objects (ccache)
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install & Enable ccache
        run: |
          sudo apt-get update && sudo apt-get install -y ccache
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "CCACHE_MAXSIZE=1G" >> $GITHUB_ENV
          ccache -s

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/launcher/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android/launcher
          ./gradlew assembleDebug --stacktrace --parallel --max-workers=$(nproc)

      - name: Show ccache Statistics
        run: ccache -s

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reVC-arm64-debug-apk
          path: android/launcher/app/build/outputs/apk/debug/*.apk
          retention-days: 14
