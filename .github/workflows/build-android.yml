name: reVC Android

on:
  push:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
  pull_request:
    branches: [ "miami" ]
    paths:
      - 'android/launcher/**'
      - 'src/**'
  release:
    types: published 

  workflow_dispatch:

permissions:
  contents: read
  actions: write
  
jobs:
  build-android:
    name: Build Android APK (${{ matrix.variant }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [debug, release]

    steps:
      - name: Checkout repository & submodules
        uses: actions/checkout@v4
        with:
          clean: true
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Compile Native reVC Libraries (arm64-v8a & armeabi-v7a)
        run: |
          for ABI in arm64-v8a armeabi-v7a; do
            echo "--- Building C++ engine for $ABI ---"
            mkdir -p build-$ABI
            cd build-$ABI
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=$ABI \
              -DANDROID_PLATFORM=android-21 \
              -DANDROID_STL=c++_shared \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release --parallel $(nproc)
            
            # Copy all compiled .so shared libraries into Gradle's jniLibs
            mkdir -p ../android/launcher/app/src/main/jniLibs/$ABI/
            find . -name "*.so" -exec cp {} ../android/launcher/app/src/main/jniLibs/$ABI/ \;
            cd ..
          done

      - name: Make gradlew executable
        run: chmod +x ./android/launcher/gradlew

      - name: Declare build version
        id: vars
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "build_version=$(git describe --always --tags "refs/remotes/origin/${HEAD_REF}")" >> $GITHUB_OUTPUT

      - name: Set assemble task name
        run: echo "ASSEMBLE_TASK=assemble${{ matrix.variant == 'debug' && 'Debug' || 'Release' }}" >> $GITHUB_ENV

      - name: Build ${{ matrix.variant }} APK with Gradle
        working-directory: android/launcher
        run: ./gradlew $ASSEMBLE_TASK --no-daemon --stacktrace --parallel --build-cache

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v4
        with:
          name: revc-${{ matrix.variant }}
          path: android/launcher/app/build/outputs/apk/${{ matrix.variant }}/app-${{ matrix.variant }}.apk
          if-no-files-found: error
